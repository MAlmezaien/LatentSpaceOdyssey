[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-network-approaches"
version = "0.1.0"
description = "Response latent space and PPI network approaches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "umap-learn>=0.5",
]

[tool.setuptools.packages.find]
where = ["response_latent_space"]
