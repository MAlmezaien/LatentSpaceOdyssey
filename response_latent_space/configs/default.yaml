paths:
  response_matrix: data/raw/ic50_matrix.csv
  drug_metadata: data/metadata/drug_metadata.csv
  cell_metadata: data/metadata/cell_metadata.csv
  out_processed_dir: data/processed
  out_qc_dir: results/qc
  out_embeddings_dir: results/embeddings
  out_clustering_dir: results/clustering
  out_interpretation_dir: results/interpretation
  out_figures_dir: results/figures

matrix:
  # Expected orientation: rows=drugs, cols=cells. If your matrix is cells×drugs, set transpose: true.
  transpose: false
  index_col: 0

preprocess:
  random_seed: 1337
  max_missing_drug: 0.2
  max_missing_cell: 0.2
  low_variance_threshold: 1.0e-8
  impute_method: drug_median
  do_log_transform: true
  # Converts IC50 to sensitivity as -log10(IC50). If do_log_transform is true, we treat values as IC50 in linear space.
  convert_to_sensitivity: true
  zscore_per_drug: true

embedding:
  latent_dims: [3, 5, 8, 10, 15]
  models: [SVD, NMF]
  nmf:
    max_iter: 2000
    tol: 1.0e-4

clustering:
  n_clusters: [2, 3, 4, 5, 6, 7, 8]
  kmeans:
    n_init: 20

plotting:
  umap:
    n_neighbors: 15
    min_dist: 0.1
    metric: euclidean
